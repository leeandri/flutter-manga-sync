name: flutter_manga_sync
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Network
  dio: ^5.4.0

  # Secure Storage (JWT) & Local Cache (Hive)
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management & Utility
  flutter_riverpod: ^2.5.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mocktail: ^1.0.5
  mockito: ^5.4.4

# Flutter-specific configuration
flutter:
  uses-material-design: true
